name: Observe Sialy socket inheritance on Windows
on:
  push:
    branches: [diagnose-563-socket-inheritance]
permissions:
  contents: read
jobs:
  socket-inheritance:
    if: github.repository == 'LuNocraf/Sialy-Desktop-Releases' && github.ref == 'refs/heads/diagnose-563-socket-inheritance'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Compile immutable synthetic fixture and observe inherited sockets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:RUNNER_TEMP 'Run-Sialy-SocketInheritance.ps1'
          [IO.File]::WriteAllBytes($script,[Convert]::FromBase64String(''))
          & $script -SnapshotBlob '64187b84412f8526fe7aa6f207da353f09be2c27' -SnapshotSha256 'a34470b35c5c76d77171e610abc4d7fcbb5a56289537b79784ec491d9a2aa6c4' -SnapshotBytes 16736 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sialy-socket-inheritance-evidence')
      - name: Preserve synthetic socket observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sialy-socket-inheritance-windows
          path: |
            ${{ runner.temp }}/sialy-socket-inheritance-evidence/production-isolation-results.json
            ${{ runner.temp }}/sialy-socket-inheritance-evidence/windows-inheritance-source-metadata.json
            ${{ runner.temp }}/sialy-socket-inheritance-evidence/inheritance-console.txt
            ${{ runner.temp }}/sialy-socket-inheritance-evidence/**/process-*.jsonl
          retention-days: 7
          if-no-files-found: error
