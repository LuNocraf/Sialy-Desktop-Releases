name: Verify clean setup relay from shipped Sialy launcher
on:
  push:
    branches: [diagnose-564-setup-relay]
permissions:
  contents: read
jobs:
  setup-relay:
    if: github.repository == 'LuNocraf/Sialy-Desktop-Releases' && github.ref == 'refs/heads/diagnose-564-setup-relay'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Compile immutable relay fixture and invoke exact old launcher methods
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:RUNNER_TEMP 'Run-Sialy-Relay.ps1'
          [IO.File]::WriteAllBytes($script,[Convert]::FromBase64String(''))
          & $script -SnapshotBlob 'e7907b63537d7c9a430d856d3223d63b7703b1ba' -SnapshotSha256 'b4fb69fc8b0161d493918eb21c7f2b66e9502ebb9f9ae60c8f16e5e5d3f7c2a3' -SnapshotBytes 148405 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sialy-setup-relay-evidence')
      - name: Preserve synthetic relay assertions and process observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sialy-setup-relay-windows
          path: |
            ${{ runner.temp }}/sialy-setup-relay-evidence/**/*.json
            ${{ runner.temp }}/sialy-setup-relay-evidence/*.txt
          retention-days: 7
          if-no-files-found: error
